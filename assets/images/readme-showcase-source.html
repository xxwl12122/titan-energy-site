<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>README Showcase Source</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071019;
      --panel: rgba(14, 19, 27, 0.86);
      --line: rgba(255, 255, 255, 0.08);
      --text: #f4f7fb;
      --muted: #96a3b3;
      --accent: #ef8753;
      --brand: #4d90d2;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 1280px;
      height: 560px;
      overflow: hidden;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(239, 135, 83, 0.22), transparent 26%),
        radial-gradient(circle at top right, rgba(77, 144, 210, 0.14), transparent 24%),
        linear-gradient(180deg, #081018, #05080d 100%);
      color: var(--text);
    }

    body {
      padding: 32px;
    }

    .frame {
      position: relative;
      height: 100%;
      overflow: hidden;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.035), transparent 28%),
        rgba(8, 13, 19, 0.92);
      box-shadow: 0 28px 70px rgba(0, 0, 0, 0.28);
    }

    .frame::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 72px 72px;
      opacity: 0.42;
      pointer-events: none;
    }

    .shell {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 388px minmax(0, 1fr);
      gap: 20px;
      height: 100%;
      padding: 24px;
    }

    .copy {
      display: grid;
      align-content: center;
      gap: 16px;
      padding: 8px 4px 8px 2px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      width: fit-content;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(244, 247, 251, 0.7);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 64px;
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    .accent {
      color: #ffc29d;
    }

    .lede {
      margin: 0;
      max-width: 22ch;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.72;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 2px;
    }

    .visual {
      min-width: 0;
    }

    .hero-card {
      position: relative;
      overflow: hidden;
      height: 100%;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(14, 19, 27, 0.82);
      box-shadow: 0 24px 52px rgba(0, 0, 0, 0.24);
    }

    .hero-card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    .hero-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(8, 12, 18, 0.04), rgba(8, 12, 18, 0.08) 38%, rgba(8, 12, 18, 0.82)),
        radial-gradient(circle at 18% 22%, rgba(255, 186, 131, 0.16), transparent 26%);
      pointer-events: none;
    }

    .hero-copy {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 18px;
      z-index: 1;
      display: grid;
      gap: 8px;
      padding: 16px 18px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(9, 13, 19, 0.36), rgba(9, 13, 19, 0.82));
      backdrop-filter: blur(12px);
    }

    .hero-copy span {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      width: fit-content;
      padding: 0 11px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(244, 247, 251, 0.72);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .hero-copy strong {
      display: block;
      font-size: 24px;
      line-height: 1.14;
      letter-spacing: -0.04em;
    }

    .hero-copy p {
      margin: 0;
      max-width: 38ch;
      color: rgba(244, 247, 251, 0.72);
      font-size: 13px;
      line-height: 1.58;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      padding: 0 15px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(244, 247, 251, 0.86);
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="shell">
      <section class="copy">
        <span class="eyebrow">Repository Overview</span>
        <h1>
          泰坦供能
          <span class="accent">项目主页</span>
        </h1>
        <p class="lede">把工业品牌气质、页面节奏、案例叙事和表单收口，压进一个更完整的单页展示站。</p>

        <div class="pill-row">
          <span class="pill">Single Page</span>
          <span class="pill">Project Flow</span>
          <span class="pill">Native Stack</span>
        </div>
      </section>

      <section class="visual">
        <article class="hero-card">
          <img src="share-cover.png" alt="项目品牌封面">
          <div class="hero-copy">
            <span>Hero Preview</span>
            <strong>从首页第一屏开始，把“更稳的能源底座”讲清楚</strong>
            <p>品牌语、主视觉、指标与行动按钮集中落位，让仓库首页也能一眼看出项目完成度。</p>
          </div>
        </article>
      </section>
    </div>
  </div>
</body>
</html>
